<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 A · S4 등록 후 돌아오기 (여러 곳)</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div id="app"></div>
<script src="lab.js"></script>
<script>
const P3 = { patch: { 17: { h: 0 }, 18: { h: 0 }, 9: { h: 0 } } };
const IDS = [17, 18, 9];
const focus = Object.assign({ focus: IDS, numbered: IDS, newChip: 5 }, P3);
LAB.sequence({
  id: 's4',
  title: 'S4 등록 후 돌아오기 (여러 곳) — 한 링크에서 3곳',
  lead: '한 링크에서 여러 곳을 저장하면 <b>지도는 첫 번째 장소가 아니라 저장한 곳 전부가 들어오게 범위를 맞추고</b>, 각 장소에 링크 속 순서대로 ①②③ 번호 표시를 붙입니다. 번호 표시는 어느 확대 단계에서도 묶음에 섞이지 않고, 겹치는 묶음 이름표는 옆으로 비켜서 점선으로 원래 자리를 가리킵니다. 같은 번호가 결과 목록에도 붙어 지도와 목록이 짝을 이룹니다.',
  sizes: ['p393', 'l844', 'p320', 'l568', 'l667', 'l932'],
  frames: [
    { t: '등록 화면 (범위 밖)', sc: { kind: 'register', reg: { summary: '인스타 링크에서 3곳: 을지로 노가리 골목 · 익선동 수제맥주 펍 · 성수 양조장', button: '3곳 저장' }, tap: 'k:regsave' },
      note: '등록 화면은 범위 밖입니다.' },
    { t: '지도에서 3곳 모두 확인', sc: Object.assign({ view: { fit: IDS }, card: { type: 'trayN', ids: IDS, title: '링크 하나에서 3곳을 저장했어요', sub: '인스타 게시물 · 방금 · 유빈 저장', numbered: true }, tap: 'p:18' }, focus),
      note: '지도를 움직이지 않아도 3곳이 모두 보입니다(성수 양조장은 촘촘한 성수동 안에 있어도 따로 표시). 나머지는 흐리게. 결과 카드가 “저장했어요” 알림을 겸합니다.' },
    { t: '② 미리보기 (방금 저장 2 / 3)', sc: Object.assign({ view: { fit: IDS, focusOn: 18, min: 70 }, sel: 18, card: { type: 'preview', id: 18, list: IDS, ctxLabel: '방금 저장한 3곳' }, tap: 'k:detail' }, focus),
      note: '이전/다음은 방금 저장한 3곳 안에서만 돕니다. ‘‹ 방금 저장한 3곳’을 누르면 결과 목록으로 돌아갑니다.' },
    { t: '② 상세', sc: Object.assign({ view: { fit: IDS, focusOn: 18, min: 70 }, sel: 18, panel: { type: 'detail', id: 18 } }, focus),
      note: '상세는 다른 장소와 똑같습니다. 닫으면 결과 목록으로 돌아갑니다.' },
    { t: '결과 카드를 닫은 뒤', sc: Object.assign({ view: { fit: 'seoul' } }, P3, { newChip: 5 }),
      note: '집중 표시가 풀려도 새 장소는 24시간 동안 묶음 이름표의 ‘NEW n’ 꼬리표와 ‘새 장소 5’ 칩으로 다시 찾을 수 있습니다.' },
  ],
});
</script>
</body>
</html>
